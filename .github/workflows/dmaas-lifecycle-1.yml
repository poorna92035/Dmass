name: dmaas-lifecycle
on:
  push: { branches: [main] }
  pull_request:
permissions: { id-token: write, contents: read }
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.LIFECYCLE_ECR_REPO }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
  LAMBDA_NAME: ${{ vars.LIFECYCLE_LAMBDA_NAME }}
  PURGE_STATE_MACHINE_ARN: ${{ vars.PURGE_STATE_MACHINE_ARN }}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: 1. Validate
        run: |
          npm ci
          npm run validate --if-present
          docker run --rm -i hadolint/hadolint < Dockerfile
          python3 -m json.tool workflows/purge.asl.json > /dev/null

      - name: 2. Unit tests
        run: npm test

      - name: 3. Build image or Lambda packages
        run: |
          docker build -t lifecycle:${{ github.sha }} .
          npm run build:lambda
          (cd dist-lambda && zip -r ../lifecycle-lambda-${{ github.sha }}.zip .)

      - name: 4a. Scan artifacts (image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: lifecycle:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: 4b. Scan artifacts (Lambda package source)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: dist-lambda
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: 5. Publish artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }}
          docker tag lifecycle:${{ github.sha }} $IMG
          docker push $IMG
          aws s3 cp lifecycle-lambda-${{ github.sha }}.zip s3://$ARTIFACT_BUCKET/dmaas-lifecycle/

      - name: 6. Deploy deletion/purge workflow
        if: github.ref == 'refs/heads/main'
        run: |
          aws lambda update-function-code --function-name $LAMBDA_NAME \
            --s3-bucket $ARTIFACT_BUCKET --s3-key dmaas-lifecycle/lifecycle-lambda-${{ github.sha }}.zip
          aws lambda wait function-updated --function-name $LAMBDA_NAME
          aws stepfunctions update-state-machine --state-machine-arn $PURGE_STATE_MACHINE_ARN \
            --definition file://workflows/purge.asl.json

      - name: 7. Smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          aws lambda invoke --function-name $LAMBDA_NAME \
            --payload '{"action":"healthcheck"}' --cli-binary-format raw-in-base64-out out.json
          cat out.json
