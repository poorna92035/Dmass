name: Terraform Infrastructure Pipeline

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      destroy:
        description: "Run Destroy"
        required: false
        default: "false"

env:
  TF_VERSION: "1.10.4"
  TG_VERSION: "0.72.3"

jobs:

  format:
    name: Format Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -recursive -check

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: format

    steps:
      - uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3

  plan:
    name: Terraform/Terragrunt Plan
    runs-on: ubuntu-latest
    needs: security-scan

    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Terragrunt
        run: |
          wget -O terragrunt \
          https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terragrunt Init
        run: terragrunt run-all init

      - name: Terragrunt Plan
        id: plan
        run: |
          terragrunt run-all plan \
          -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: .

  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: production

    steps:
      - run: echo "Waiting for approval"

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Terragrunt
        run: |
          wget -O terragrunt \
          https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Terragrunt Apply
        run: |
          terragrunt run-all apply \
          --terragrunt-non-interactive \
          -auto-approve

  smoke-test:
    name: Infrastructure Smoke Test
    runs-on: ubuntu-latest
    needs: apply

    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Resource Group
        run: |
          az group list \
          --query "[].name"

      - name: Validate Storage Account
        run: |
          az storage account list \
          --query "[].name"

      - name: Validate Service Bus
        run: |
          az servicebus namespace list \
          --query "[].name"

      - name: Smoke Test Passed
        run: echo "Infrastructure validation completed"

  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: smoke-test

    if: github.event.inputs.destroy == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Terragrunt
        run: |
          wget -O terragrunt \
          https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TG_VERSION }}/terragrunt_linux_amd64

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Manual Destroy Confirmation
        run: echo "Destroy approved"

      - name: Terragrunt Destroy
        run: |
          terragrunt run-all destroy \
          --terragrunt-non-interactive \
          -auto-approve
