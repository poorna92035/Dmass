name: dmaas-core
on:
  push: { branches: [main] }
  pull_request:
permissions: { id-token: write, contents: read }
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CA_DOMAIN: ${{ vars.CA_DOMAIN }}
  CA_OWNER: ${{ vars.AWS_ACCOUNT_ID }}
  CA_REPO: ${{ vars.CA_REPO }}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: 1. Validate
        run: |
          npm ci
          npm run validate --if-present
          npm ls --all > /dev/null

      - name: 2. Unit tests
        run: npm test

      - name: 3. Type/lint/security checks
        run: |
          npm run typecheck
          npm run lint
          npm audit --audit-level=high

      - name: 4. Build stable contracts/utilities
        run: npm run build

      - name: 5. Publish to CodeArtifact
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 5. Publish to CodeArtifact (publish)
        if: github.ref == 'refs/heads/main'
        run: |
          aws codeartifact login --tool npm --domain $CA_DOMAIN \
            --domain-owner $CA_OWNER --repository $CA_REPO
          npm publish
