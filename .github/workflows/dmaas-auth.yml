name: dmaas-auth
on:
  push: { branches: [main] }
  pull_request:
permissions: { id-token: write, contents: read }
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
  FUNCTION_NAME: ${{ vars.AUTH_FUNCTION_NAME }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Security scan
        run: |
          npm audit --audit-level=high
          npx --yes snyk test --severity-threshold=high || true
      - name: Build Lambda artifact
        run: |
          npm run build
          cd dist && zip -r ../auth-${{ github.sha }}.zip .
      - uses: actions/upload-artifact@v4
        with: { name: auth-zip, path: auth-${{ github.sha }}.zip }

  publish-deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with: { name: auth-zip }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish artifact
        run: aws s3 cp auth-${{ github.sha }}.zip s3://$ARTIFACT_BUCKET/dmaas-auth/
      - name: Deploy Auth component
        run: |
          aws lambda update-function-code --function-name $FUNCTION_NAME \
            --s3-bucket $ARTIFACT_BUCKET --s3-key dmaas-auth/auth-${{ github.sha }}.zip --publish
          aws lambda wait function-updated --function-name $FUNCTION_NAME
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.AUTH_HEALTH_URL }}"
