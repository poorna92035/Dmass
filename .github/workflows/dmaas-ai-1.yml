name: dmaas-ai
on:
  push: { branches: [main] }
  pull_request:
permissions: { id-token: write, contents: read }
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.AI_ECR_REPO }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.AI_ECS_SERVICE }}
  LAMBDA_NAME: ${{ vars.AI_LAMBDA_NAME }}
  STATE_MACHINE_ARN: ${{ vars.AI_STATE_MACHINE_ARN }}
jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - name: 1. Validate
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip check
          docker run --rm -i hadolint/hadolint < Dockerfile
          python -m json.tool workflows/ai-state-machine.asl.json > /dev/null

      - name: 2. Unit tests
        run: pytest

      - name: 3. Build Docker image
        run: docker build -t ai:${{ github.sha }} .

      - name: 4. Scan image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ai:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: 5. Push image to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }}
          docker tag ai:${{ github.sha }} $IMG
          docker push $IMG

      - name: 6. Package Lambda handlers where required
        run: |
          pip install -r requirements.txt -t build/
          cp -r src/lambda/* build/
          (cd build && zip -r ../ai-lambda-${{ github.sha }}.zip .)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            aws s3 cp ai-lambda-${{ github.sha }}.zip s3://$ARTIFACT_BUCKET/dmaas-ai/
            aws lambda update-function-code --function-name $LAMBDA_NAME \
              --s3-bucket $ARTIFACT_BUCKET --s3-key dmaas-ai/ai-lambda-${{ github.sha }}.zip
          fi

      - name: 7. Deploy ECS service and workflows
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
          aws stepfunctions update-state-machine --state-machine-arn $STATE_MACHINE_ARN \
            --definition file://workflows/ai-state-machine.asl.json

      - name: 8. Smoke test
        if: github.ref == 'refs/heads/main'
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.AI_HEALTH_URL }}"
