name: dmaas-core
on:
  push: { branches: [main] }
  pull_request:
permissions: { id-token: write, contents: read }
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CA_DOMAIN: ${{ vars.CA_DOMAIN }}
  CA_OWNER: ${{ vars.AWS_ACCOUNT_ID }}
  CA_REPO: ${{ vars.CA_REPO }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type / lint / security checks
        run: |
          npm run typecheck
          npm run lint
          npm audit --audit-level=high
      - name: Build stable contracts/utilities
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish to CodeArtifact
        run: |
          aws codeartifact login --tool npm --domain $CA_DOMAIN \
            --domain-owner $CA_OWNER --repository $CA_REPO
          npm publish
