name: dmaas-ai
on:
  push: { branches: [main] }
  pull_request:
permissions: { id-token: write, contents: read }
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.AI_ECR_REPO }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.AI_ECS_SERVICE }}
  LAMBDA_NAME: ${{ vars.AI_LAMBDA_NAME }}
  STATE_MACHINE_ARN: ${{ vars.AI_STATE_MACHINE_ARN }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest
      - name: Build Docker image
        run: docker build -t ai:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ai:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Package Lambda handlers (where required)
        run: |
          pip install -r requirements.txt -t build/
          cp -r src/lambda/* build/
          cd build && zip -r ../ai-lambda-${{ github.sha }}.zip .
      - run: docker save ai:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai
          path: |
            image.tar.gz
            ai-lambda-${{ github.sha }}.zip

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ai }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to ECR
        run: |
          gunzip -c image.tar.gz | docker load
          IMG=${{ steps.ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }}
          docker tag ai:${{ github.sha }} $IMG
          docker push $IMG
      - name: Update Lambda handlers
        run: |
          aws s3 cp ai-lambda-${{ github.sha }}.zip s3://$ARTIFACT_BUCKET/dmaas-ai/
          aws lambda update-function-code --function-name $LAMBDA_NAME \
            --s3-bucket $ARTIFACT_BUCKET --s3-key dmaas-ai/ai-lambda-${{ github.sha }}.zip
      - name: Deploy ECS service and workflows
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
          aws stepfunctions update-state-machine --state-machine-arn $STATE_MACHINE_ARN \
            --definition file://workflows/ai-state-machine.asl.json
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.AI_HEALTH_URL }}"
